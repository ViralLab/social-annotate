<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sandbox Survey Form</title>
  <link rel="stylesheet" type="text/css" href="../dep/jsonform/deps/opt/bootstrap.css">
  <style id="dynamic-css"></style>
  <style>
    html, body {
      background: transparent !important;
      background-color: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color-scheme: dark light;
    }
    /* Neutralize fixed/absolute positioning used in inject.css so the
       iframe body correctly reflects the actual content height */
    #surveyForm {
      position: static !important;
      width: 100% !important;
    }
    div.survey-container-tweet {
      height: auto !important;
      min-height: unset !important;
      position: static !important;
    }
    div.survey-container-user {
      position: static !important;
      min-height: unset !important;
    }
  </style>
</head>
<body>
  <form id="surveyForm">
  </form>

  <script src="../dep/jsonform/deps/jquery.min.js"></script>
  <script src="../dep/jsonform/deps/underscore.js"></script>
  <script src="../dep/jsonform/deps/opt/jsv.js"></script>
  <script src="../dep/jsonform/lib/jsonform.js"></script>
  <script src="survey.js"></script>
</body>
</html>
